name: fusion-metamorphic-contract-admission-seed-replication

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: fusion-metamorphic-contract-admission-seed-replication-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/fusion-unseen-source-generalization.yml
      - src/opfusion/fusion_metamorphic_contract_admission.py
      - tests/test_fusion_metamorphic_contract_admission.py
      - src/opfusion/fusion_metamorphic_contract_diagnostic.py
  workflow_dispatch:

jobs:
  replicate:
    strategy:
      fail-fast: false
      matrix:
        scorer_seed: ['741001', '741002', '741003']
        heldout:
          - scalar.add
          - aggregation.sum
          - scalar.min
          - scalar.max
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test metamorphic admission helpers
        run: pytest -q tests/test_fusion_metamorphic_contract_admission.py tests/test_fusion_metamorphic_contract_diagnostic.py
      - name: Run seed replication
        shell: bash
        run: |
          set +e
          seed='${{ matrix.scorer_seed }}'
          heldout='${{ matrix.heldout }}'
          mkdir -p evaluations/metamorphic_contract_admission_seed_replication
          python -m opfusion.fusion_metamorphic_contract_admission \
            --root "$GITHUB_WORKSPACE" \
            --heldout "$heldout" \
            --scorer-seed "$seed" \
            --train-seed 741000 \
            --calibration-seed 749000 \
            --calibration-examples 4 \
            --data-seed 741500 \
            --examples-per-pair 2 \
            --max-new-tokens 64 \
            --out "evaluations/metamorphic_contract_admission_seed_replication/seed-${seed}-${heldout}.json" \
            > "metamorphic-seed-${seed}-${heldout}.log" 2>&1
          status=$?
          echo "$status" > "metamorphic-seed-${seed}-${heldout}.status"
          cat "metamorphic-seed-${seed}-${heldout}.log"
          exit "$status"
      - name: Post seed result to PR 53
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          seed='${{ matrix.scorer_seed }}'
          heldout='${{ matrix.heldout }}'
          result="evaluations/metamorphic_contract_admission_seed_replication/seed-${seed}-${heldout}.json"
          python - "$result" "$seed" > summary.md <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1], encoding='utf-8')); seed=sys.argv[2]
          d=r['correct_count_deltas']; h=r['heldout_operator']; c=r['calibration']
          hu=d['metamorphic_hard_useful']; hm=d['metamorphic_hard_mixed']; nm=d['nuisance_marginal_hard']
          print(f"### Metamorphic admission replication: seed `{seed}`, `{h}`")
          print()
          print(f"- threshold `{c['threshold']:.6f}`, calibration BAcc `{c['balanced_accuracy']:.4f}`")
          print(f"- hard useful: involved `{hu['heldout_involved']:+d}`, neither `{hu['heldout_neither']:+d}`, net `{hu['net']:+d}/96`")
          print(f"- hard mixed: involved `{hm['heldout_involved']:+d}`, neither `{hm['heldout_neither']:+d}`, net `{hm['net']:+d}/96`")
          print(f"- NEG marginal hard: involved `{nm['heldout_involved']:+d}`, neither `{nm['heldout_neither']:+d}`, net `{nm['net']:+d}/96`")
          PY
          gh pr comment 53 --repo Unjuno/math-operator-units --body-file summary.md
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metamorphic-seed-${{ matrix.scorer_seed }}-${{ matrix.heldout }}
          path: |
            metamorphic-seed-*.log
            metamorphic-seed-*.status
            evaluations/metamorphic_contract_admission_seed_replication/*.json
          if-no-files-found: warn
      - name: Enforce experiment success
        if: always()
        run: test "$(cat metamorphic-seed-${{ matrix.scorer_seed }}-${{ matrix.heldout }}.status)" = "0"
