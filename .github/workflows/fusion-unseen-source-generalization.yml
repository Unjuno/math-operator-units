name: fusion-metamorphic-contract-diagnostic

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: fusion-metamorphic-contract-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/fusion-unseen-source-generalization.yml
      - src/opfusion/fusion_metamorphic_contract_diagnostic.py
      - tests/test_fusion_metamorphic_contract_diagnostic.py
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test metamorphic contract helpers
        run: pytest -q tests/test_fusion_metamorphic_contract_diagnostic.py
      - name: Run metamorphic contract diagnostic
        shell: bash
        run: |
          set +e
          mkdir -p evaluations/metamorphic_contract_diagnostic
          python -m opfusion.fusion_metamorphic_contract_diagnostic \
            --root "$GITHUB_WORKSPACE" \
            --examples-per-operator 4 \
            --data-seed 748000 \
            --max-new-tokens 64 \
            --out evaluations/metamorphic_contract_diagnostic/diagnostic.json \
            > metamorphic-contract.log 2>&1
          status=$?
          echo "$status" > metamorphic-contract.status
          cat metamorphic-contract.log
          exit "$status"
      - name: Post diagnostic summary to PR 51
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=evaluations/metamorphic_contract_diagnostic/diagnostic.json
          python - "$result" > summary.md <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1], encoding='utf-8'))
          s=r['score_summary']; sel=r['selection_summary']
          print('### Task-conditioned metamorphic contract diagnostic')
          print()
          print(f"- rows: `{s['rows']}`; correct `{s['positive_rows']}`, incorrect `{s['negative_rows']}`")
          print(f"- consensus=1 rows: `{s['consensus_one_rows']}`; correct `{s['consensus_one_positive_rows']}`, stable-wrong `{s['consensus_one_negative_rows']}`")
          for key in ('consensus','contract_rate','contract_weighted','consensus_x_contract','consensus_x_weighted_contract'):
              row=s['scores'][key]
              print(f"- `{key}` AUC all / consensus=1: `{row['auc_all']}` / `{row['auc_consensus_one']}`")
          print()
          for key in ('consensus','contract_weighted','consensus_x_weighted_contract'):
              row=sel[key]
              print(f"- top `{key}`: contains-correct `{row['top_set_contains_correct_rate']:.4f}`, all-top-correct `{row['all_top_sources_correct_rate']:.4f}`, matching-in-top `{row['matching_specialist_in_top_rate']:.4f}`, matching-strict-top `{row['matching_specialist_strict_top_rate']:.4f}`")
          print()
          for task, block in r['by_task'].items():
              row=block['contract_weighted']
              print(f"- `{task}` weighted-contract AUC all / consensus=1: `{row['auc_all']}` / `{row['auc_consensus_one']}`")
          print()
          print('The contract score uses task-defined output relations under input transformations, not the exact answer and not source identity.')
          PY
          gh pr comment 51 --repo Unjuno/math-operator-units --body-file summary.md
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metamorphic-contract-diagnostic
          path: |
            metamorphic-contract.log
            metamorphic-contract.status
            evaluations/metamorphic_contract_diagnostic/diagnostic.json
          if-no-files-found: warn
      - name: Enforce diagnostic success
        if: always()
        run: test "$(cat metamorphic-contract.status)" = "0"
