name: fusion-unseen-source-generalization

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: fusion-unseen-source-generalization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/fusion-unseen-source-generalization.yml
      - src/opfusion/fusion_unseen_source_generalization.py
      - tests/test_fusion_unseen_source_generalization.py
  workflow_dispatch:

jobs:
  leave-one-unit-out:
    strategy:
      fail-fast: false
      matrix:
        heldout:
          - scalar.add
          - aggregation.sum
          - scalar.min
          - scalar.max
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test identity-free scorer helpers
        run: pytest -q tests/test_fusion_unseen_source_generalization.py
      - name: Run leave-one-unit-out pilot
        shell: bash
        run: |
          set +e
          heldout='${{ matrix.heldout }}'
          mkdir -p evaluations/unseen_source_generalization
          python -m opfusion.fusion_unseen_source_generalization \
            --root "$GITHUB_WORKSPACE" \
            --heldout "$heldout" \
            --train-examples-per-operator 24 \
            --max-positions-per-cohort 3072 \
            --train-seed 741000 \
            --scorer-hidden-size 16 \
            --scorer-learning-rate 0.02 \
            --scorer-steps 400 \
            --scorer-batch-positions 256 \
            --scorer-seed 741000 \
            --examples-per-pair 2 \
            --data-seed 741500 \
            --max-new-tokens 64 \
            --device cpu \
            --out "evaluations/unseen_source_generalization/${heldout}.json" \
            > "unseen-source-${heldout}.log" 2>&1
          status=$?
          echo "$status" > "unseen-source-${heldout}.status"
          cat "unseen-source-${heldout}.log"
          exit "$status"
      - name: Post result summary to PR 40
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          heldout='${{ matrix.heldout }}'
          result="evaluations/unseen_source_generalization/${heldout}.json"
          python - "$result" > summary.md <<'PY'
          import json
          import sys
          p = sys.argv[1]
          r = json.load(open(p, encoding='utf-8'))
          h = r['heldout_operator']
          w0 = r['without_heldout_source']
          w1 = r['with_heldout_source']
          s0i = w0['subsets']['heldout_as_inner']['inner_accuracy']
          s1i = w1['subsets']['heldout_as_inner']['inner_accuracy']
          s0o = w0['subsets']['heldout_as_outer']['oracle_intermediate_outer_accuracy']
          s1o = w1['subsets']['heldout_as_outer']['oracle_intermediate_outer_accuracy']
          e0 = w0['subsets']['heldout_involved']['end_to_end_accuracy']
          e1 = w1['subsets']['heldout_involved']['end_to_end_accuracy']
          a0 = w0['aggregate']['end_to_end_accuracy']
          a1 = w1['aggregate']['end_to_end_accuracy']
          fit = r['scorer_fit']
          print(f"### Unseen-source pilot: `{h}`")
          print()
          print(f"- scorer NLL: `{fit['optimization_first']:.6f} -> {fit['optimization_last']:.6f}` over `{fit['positions']}` teacher-forced positions")
          print(f"- held-out as inner, inner accuracy: `{s0i:.4f} -> {s1i:.4f}` (delta `{s1i-s0i:+.4f}`)")
          print(f"- held-out as outer, oracle-intermediate outer accuracy: `{s0o:.4f} -> {s1o:.4f}` (delta `{s1o-s0o:+.4f}`)")
          print(f"- pairs involving held-out, end-to-end: `{e0:.4f} -> {e1:.4f}` (delta `{e1-e0:+.4f}`)")
          print(f"- all 96 composition cases, end-to-end: `{a0:.4f} -> {a1:.4f}` (delta `{a1-a0:+.4f}`)")
          print()
          print("The arrow is **without held-out source -> same scorer with held-out source newly inserted**.")
          PY
          gh pr comment 40 --repo Unjuno/math-operator-units --body-file summary.md
      - name: Upload held-out result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-unseen-source-${{ matrix.heldout }}
          path: |
            unseen-source-*.log
            unseen-source-*.status
            evaluations/unseen_source_generalization/*.json
          if-no-files-found: warn
      - name: Enforce experiment success
        if: always()
        shell: bash
        run: test "$(cat unseen-source-${{ matrix.heldout }}.status)" = "0"
