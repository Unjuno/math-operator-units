name: fusion-unseen-source-generalization

concurrency:
  group: fusion-unseen-source-generalization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/fusion-unseen-source-generalization.yml
      - src/opfusion/fusion_unseen_source_generalization.py
      - tests/test_fusion_unseen_source_generalization.py
  workflow_dispatch:

jobs:
  leave-one-unit-out:
    strategy:
      fail-fast: false
      matrix:
        heldout:
          - scalar.add
          - aggregation.sum
          - scalar.min
          - scalar.max
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test identity-free scorer helpers
        run: pytest -q tests/test_fusion_unseen_source_generalization.py
      - name: Run leave-one-unit-out pilot
        shell: bash
        run: |
          set +e
          heldout='${{ matrix.heldout }}'
          mkdir -p evaluations/unseen_source_generalization
          python -m opfusion.fusion_unseen_source_generalization \
            --root "$GITHUB_WORKSPACE" \
            --heldout "$heldout" \
            --train-examples-per-operator 24 \
            --max-positions-per-cohort 3072 \
            --train-seed 741000 \
            --scorer-hidden-size 16 \
            --scorer-learning-rate 0.02 \
            --scorer-steps 400 \
            --scorer-batch-positions 256 \
            --scorer-seed 741000 \
            --examples-per-pair 2 \
            --data-seed 741500 \
            --max-new-tokens 64 \
            --device cpu \
            --out "evaluations/unseen_source_generalization/${heldout}.json" \
            > "unseen-source-${heldout}.log" 2>&1
          status=$?
          echo "$status" > "unseen-source-${heldout}.status"
          cat "unseen-source-${heldout}.log"
          exit "$status"
      - name: Upload held-out result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-unseen-source-${{ matrix.heldout }}
          path: |
            unseen-source-*.log
            unseen-source-*.status
            evaluations/unseen_source_generalization/*.json
          if-no-files-found: warn
      - name: Enforce experiment success
        if: always()
        shell: bash
        run: test "$(cat unseen-source-${{ matrix.heldout }}.status)" = "0"
