name: fusion-behavioral-admission-seed-replication

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: fusion-behavioral-admission-seed-replication-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/fusion-unseen-source-generalization.yml
      - src/opfusion/fusion_behavioral_admission_seed_replication.py
      - tests/test_fusion_behavioral_admission_seed_replication.py
      - src/opfusion/fusion_unseen_source_behavioral_admission.py
  workflow_dispatch:

jobs:
  deterministic-replication:
    strategy:
      fail-fast: false
      matrix:
        heldout:
          - scalar.add
          - aggregation.sum
          - scalar.min
          - scalar.max
        scorer_seed:
          - 741000
          - 741001
          - 741002
          - 741003
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test deterministic replication helpers
        run: pytest -q tests/test_fusion_behavioral_admission_seed_replication.py tests/test_fusion_unseen_source_behavioral_admission.py
      - name: Run deterministic seed replication
        shell: bash
        run: |
          set +e
          heldout='${{ matrix.heldout }}'
          seed='${{ matrix.scorer_seed }}'
          tag="${heldout}-s${seed}"
          mkdir -p evaluations/behavioral_admission_seed_replication
          python -m opfusion.fusion_behavioral_admission_seed_replication \
            --root "$GITHUB_WORKSPACE" \
            --heldout "$heldout" \
            --scorer-seed "$seed" \
            --train-seed 741000 \
            --data-seed 741500 \
            --consensus-power 2.0 \
            --examples-per-pair 2 \
            --max-new-tokens 64 \
            --out "evaluations/behavioral_admission_seed_replication/${tag}.json" \
            > "replication-${tag}.log" 2>&1
          status=$?
          echo "$status" > "replication-${tag}.status"
          cat "replication-${tag}.log"
          exit "$status"
      - name: Post deterministic replication summary to PR 47
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          heldout='${{ matrix.heldout }}'
          seed='${{ matrix.scorer_seed }}'
          tag="${heldout}-s${seed}"
          result="evaluations/behavioral_admission_seed_replication/${tag}.json"
          python - "$result" > summary.md <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1], encoding='utf-8'))
          h=r['heldout_operator']; seed=r['replication']['scorer_seed']; d=r['insertion_deltas']
          diag=r['behavioral_heldout_insertion']['diagnostics']; runtime=r['replication']['runtime']
          ri=round(d['raw_involved']*42); rn=round(d['raw_neither']*54)
          bi=round(d['behavioral_involved']*42); bn=round(d['behavioral_neither']*54)
          print(f"### Deterministic replication: `{h}`, seed `{seed}`")
          print()
          print(f"- raw insertion counts involved/neither: `{ri:+d}/42`, `{rn:+d}/54` (net `{ri+rn:+d}/96`)")
          print(f"- behavioral counts involved/neither: `{bi:+d}/42`, `{bn:+d}/54` (net `{bi+bn:+d}/96`)")
          print(f"- behavioral minus raw net insertion: `{(bi+bn)-(ri+rn):+d}/96`")
          print(f"- consensus matching/nonmatching: `{diag['mean_matching_heldout_consensus']:.4f}` / `{diag['mean_nonmatching_heldout_consensus']:.4f}`")
          print(f"- held-out gate raw/effective: `{diag['mean_heldout_raw_gate']:.4f}` / `{diag['mean_heldout_effective_gate']:.4f}`")
          print(f"- deterministic runtime: `{runtime}`")
          PY
          gh pr comment 47 --repo Unjuno/math-operator-units --body-file summary.md
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavioral-replication-${{ matrix.heldout }}-s${{ matrix.scorer_seed }}
          path: |
            replication-*.log
            replication-*.status
            evaluations/behavioral_admission_seed_replication/*.json
          if-no-files-found: warn
      - name: Enforce experiment success
        if: always()
        shell: bash
        run: |
          heldout='${{ matrix.heldout }}'
          seed='${{ matrix.scorer_seed }}'
          test "$(cat replication-${heldout}-s${seed}.status)" = "0"
