name: fusion-unseen-source-field-sketch

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: fusion-unseen-source-field-sketch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/fusion-unseen-source-generalization.yml
      - src/opfusion/fusion_unseen_source_field_sketch.py
      - tests/test_fusion_unseen_source_field_sketch.py
      - src/opfusion/fusion_unseen_source_generalization.py
  workflow_dispatch:

jobs:
  field-sketch-leave-one-unit-out:
    strategy:
      fail-fast: false
      matrix:
        heldout:
          - scalar.add
          - aggregation.sum
          - scalar.min
          - scalar.max
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test full-field sketch scorer
        run: pytest -q tests/test_fusion_unseen_source_generalization.py tests/test_fusion_unseen_source_field_sketch.py
      - name: Run field-sketch leave-one-unit-out pilot
        shell: bash
        run: |
          set +e
          heldout='${{ matrix.heldout }}'
          mkdir -p evaluations/unseen_source_field_sketch
          python -m opfusion.fusion_unseen_source_field_sketch \
            --root "$GITHUB_WORKSPACE" \
            --heldout "$heldout" \
            --train-examples-per-operator 24 \
            --max-positions-per-cohort 3072 \
            --train-seed 741000 \
            --sketch-size 32 \
            --sketch-seed 743000 \
            --scorer-hidden-size 64 \
            --scorer-learning-rate 0.01 \
            --scorer-steps 600 \
            --scorer-batch-positions 256 \
            --scorer-seed 741000 \
            --examples-per-pair 2 \
            --data-seed 741500 \
            --max-new-tokens 64 \
            --device cpu \
            --out "evaluations/unseen_source_field_sketch/${heldout}.json" \
            > "unseen-field-${heldout}.log" 2>&1
          status=$?
          echo "$status" > "unseen-field-${heldout}.status"
          cat "unseen-field-${heldout}.log"
          exit "$status"
      - name: Post field-sketch summary to PR 41
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          heldout='${{ matrix.heldout }}'
          result="evaluations/unseen_source_field_sketch/${heldout}.json"
          python - "$result" > summary.md <<'PY'
          import json
          import sys
          r = json.load(open(sys.argv[1], encoding='utf-8'))
          h = r['heldout_operator']
          w0 = r['without_heldout_source']
          w1 = r['with_heldout_source']
          inner0 = w0['subsets']['heldout_as_inner']['inner_accuracy']
          inner1 = w1['subsets']['heldout_as_inner']['inner_accuracy']
          outer0 = w0['subsets']['heldout_as_outer']['oracle_intermediate_outer_accuracy']
          outer1 = w1['subsets']['heldout_as_outer']['oracle_intermediate_outer_accuracy']
          inv0 = w0['subsets']['heldout_involved']['end_to_end_accuracy']
          inv1 = w1['subsets']['heldout_involved']['end_to_end_accuracy']
          nei0 = w0['subsets']['heldout_neither']['end_to_end_accuracy']
          nei1 = w1['subsets']['heldout_neither']['end_to_end_accuracy']
          all0 = w0['aggregate']['end_to_end_accuracy']
          all1 = w1['aggregate']['end_to_end_accuracy']
          fit = r['scorer_fit']
          print(f"### Full-field sketch pilot: `{h}`")
          print()
          print(f"- scorer NLL: `{fit['optimization_first']:.6f} -> {fit['optimization_last']:.6f}`; sketch `{fit['sketch_size']}`, feature dim `{fit['feature_size']}`")
          print(f"- held-out inner accuracy: `{inner0:.4f} -> {inner1:.4f}` (delta `{inner1-inner0:+.4f}`)")
          print(f"- held-out outer accuracy: `{outer0:.4f} -> {outer1:.4f}` (delta `{outer1-outer0:+.4f}`)")
          print(f"- held-out involved E2E: `{inv0:.4f} -> {inv1:.4f}` (delta `{inv1-inv0:+.4f}`)")
          print(f"- held-out neither E2E: `{nei0:.4f} -> {nei1:.4f}` (delta `{nei1-nei0:+.4f}`)")
          print(f"- all 96 E2E: `{all0:.4f} -> {all1:.4f}` (delta `{all1-all0:+.4f}`)")
          PY
          gh pr comment 41 --repo Unjuno/math-operator-units --body-file summary.md
      - name: Upload field-sketch result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-unseen-field-${{ matrix.heldout }}
          path: |
            unseen-field-*.log
            unseen-field-*.status
            evaluations/unseen_source_field_sketch/*.json
          if-no-files-found: warn
      - name: Enforce experiment success
        if: always()
        shell: bash
        run: test "$(cat unseen-field-${{ matrix.heldout }}.status)" = "0"
