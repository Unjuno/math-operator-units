name: fusion-metamorphic-contract-plugin-admission

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: fusion-metamorphic-contract-plugin-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/fusion-unseen-source-generalization.yml
      - src/opfusion/fusion_metamorphic_contract_admission.py
      - tests/test_fusion_metamorphic_contract_admission.py
      - src/opfusion/fusion_metamorphic_contract_diagnostic.py
  workflow_dispatch:

jobs:
  admission:
    strategy:
      fail-fast: false
      matrix:
        heldout:
          - scalar.add
          - aggregation.sum
          - scalar.min
          - scalar.max
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test metamorphic admission helpers
        run: pytest -q tests/test_fusion_metamorphic_contract_admission.py tests/test_fusion_metamorphic_contract_diagnostic.py
      - name: Run metamorphic mixed-plugin admission
        shell: bash
        run: |
          set +e
          heldout='${{ matrix.heldout }}'
          mkdir -p evaluations/metamorphic_contract_admission
          python -m opfusion.fusion_metamorphic_contract_admission \
            --root "$GITHUB_WORKSPACE" \
            --heldout "$heldout" \
            --scorer-seed 741000 \
            --train-seed 741000 \
            --calibration-seed 749000 \
            --calibration-examples 4 \
            --data-seed 741500 \
            --examples-per-pair 2 \
            --max-new-tokens 64 \
            --out "evaluations/metamorphic_contract_admission/${heldout}.json" \
            > "metamorphic-admission-${heldout}.log" 2>&1
          status=$?
          echo "$status" > "metamorphic-admission-${heldout}.status"
          cat "metamorphic-admission-${heldout}.log"
          exit "$status"
      - name: Post metamorphic admission summary to PR 52
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          heldout='${{ matrix.heldout }}'
          result="evaluations/metamorphic_contract_admission/${heldout}.json"
          python - "$result" > summary.md <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1], encoding='utf-8'))
          d=r['correct_count_deltas']; c=r['calibration']; h=r['heldout_operator']
          print(f"### Metamorphic contract admission: `{h}`")
          print()
          print(f"- calibrated score threshold: `{c['threshold']:.6f}`; balanced accuracy `{c['balanced_accuracy']:.4f}`, TPR `{c['tpr']:.4f}`, TNR `{c['tnr']:.4f}`, rows `{c['rows']}`")
          for key in ('metamorphic_continuous_useful','metamorphic_continuous_mixed','metamorphic_hard_useful','metamorphic_hard_mixed'):
              row=d[key]
              print(f"- `{key}`: involved `{row['heldout_involved']:+d}/42`, neither `{row['heldout_neither']:+d}/54`, net `{row['net']:+d}/96`")
          for key in ('nuisance_marginal_continuous','nuisance_marginal_hard'):
              row=d[key]
              print(f"- `{key}`: involved `{row['heldout_involved']:+d}`, neither `{row['heldout_neither']:+d}`, net `{row['net']:+d}/96`")
          hm=r['modes']['metamorphic_hard_mixed']['diagnostics']
          useful=hm[h]; neg=hm[r['nuisance_source']]
          print(f"- useful score matching/nonmatching: `{useful['matching_mean_consensus']:.4f}` / `{useful['nonmatching_mean_consensus']:.4f}`; gate `{useful['mean_raw_gate']:.4f} -> {useful['mean_effective_gate']:.4f}`")
          print(f"- NEG mean score: `{neg['mean_consensus']:.4f}`; gate `{neg['mean_raw_gate']:.4f} -> {neg['mean_effective_gate']:.4f}`")
          PY
          gh pr comment 52 --repo Unjuno/math-operator-units --body-file summary.md
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metamorphic-admission-${{ matrix.heldout }}
          path: |
            metamorphic-admission-*.log
            metamorphic-admission-*.status
            evaluations/metamorphic_contract_admission/*.json
          if-no-files-found: warn
      - name: Enforce experiment success
        if: always()
        run: test "$(cat metamorphic-admission-${{ matrix.heldout }}.status)" = "0"
