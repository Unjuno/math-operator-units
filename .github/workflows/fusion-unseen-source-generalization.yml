name: fusion-unseen-source-rollout-consensus

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: fusion-unseen-source-rollout-consensus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/fusion-unseen-source-generalization.yml
      - src/opfusion/fusion_unseen_source_rollout_consensus.py
      - tests/test_fusion_unseen_source_rollout_consensus.py
  workflow_dispatch:

jobs:
  rollout-consensus-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test consensus helpers
        run: pytest -q tests/test_fusion_unseen_source_rollout_consensus.py
      - name: Run semantic-view rollout diagnostic
        shell: bash
        run: |
          set +e
          mkdir -p evaluations/unseen_source_rollout_consensus
          python -m opfusion.fusion_unseen_source_rollout_consensus \
            --root "$GITHUB_WORKSPACE" \
            --examples-per-operator 4 \
            --data-seed 745000 \
            --max-new-tokens 64 \
            --include-neg \
            --device cpu \
            --out evaluations/unseen_source_rollout_consensus/report.json \
            > rollout-consensus.log 2>&1
          status=$?
          echo "$status" > rollout-consensus.status
          cat rollout-consensus.log
          exit "$status"
      - name: Post consensus summary to PR 44
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - evaluations/unseen_source_rollout_consensus/report.json > summary.md <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1], encoding='utf-8'))
          s=r['summary']; q=r['selection_diagnostic']
          print('### Semantic-view rollout consensus diagnostic')
          print()
          print(f"- source/example rows: `{s['rows']}`; majority-correct `{s['positive_rows']}`, incorrect `{s['negative_rows']}`")
          print(f"- consensus AUC for majority correctness: `{s['consensus_auc_for_majority_correct']}`")
          print(f"- parse-rate AUC: `{s['parse_rate_auc_for_majority_correct']}`")
          print(f"- mean consensus, correct vs incorrect: `{s['mean_consensus_positive']} vs {s['mean_consensus_negative']}`")
          print(f"- top-consensus set contains a correct source: `{q['top_consensus_set_contains_majority_correct_source_rate']}`")
          print(f"- all top-consensus sources are correct: `{q['all_top_consensus_sources_majority_correct_rate']}`")
          print(f"- matching specialist in top-consensus set: `{q['matching_specialist_in_top_consensus_set_rate']}`")
          print(f"- matching specialist strictly top: `{q['matching_specialist_strictly_highest_consensus_rate']}`")
          print()
          print('Per task:')
          for op,row in s['by_task_operator'].items():
              print(f"- `{op}`: AUC `{row['consensus_auc_for_majority_correct']}`, positive `{row['positive_rows']}/{row['rows']}`, consensus correct/incorrect `{row['mean_consensus_positive']} / {row['mean_consensus_negative']}`")
          print()
          print('Within-source matching-minus-nonmatching consensus:')
          for source,row in s['within_source_context_contrast'].items():
              print(f"- `{source}`: `{row['matching_minus_nonmatching_consensus']}`; correctness `{row['matching_mean_correct_fraction']} vs {row['nonmatching_mean_correct_fraction']}`")
          PY
          gh pr comment 44 --repo Unjuno/math-operator-units --body-file summary.md
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-unseen-source-rollout-consensus
          path: |
            rollout-consensus.log
            rollout-consensus.status
            evaluations/unseen_source_rollout_consensus/report.json
          if-no-files-found: warn
      - name: Enforce experiment success
        if: always()
        run: test "$(cat rollout-consensus.status)" = "0"
