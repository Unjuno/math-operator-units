name: fusion-unseen-source-generalization

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: fusion-unseen-source-generalization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/fusion-unseen-source-generalization.yml
      - src/opfusion/fusion_unseen_source_generalization.py
      - src/opfusion/fusion_unseen_source_invariant.py
      - src/opfusion/fusion_unseen_source_absolute_gate.py
      - tests/test_fusion_unseen_source_generalization.py
  workflow_dispatch:

jobs:
  leave-one-unit-out-absolute-gate:
    strategy:
      fail-fast: false
      matrix:
        heldout:
          - scalar.add
          - aggregation.sum
          - scalar.min
          - scalar.max
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test absolute gate insertion locality
        shell: bash
        run: |
          python - <<'PY'
          import torch
          from opfusion import fusion_unseen_source_absolute_gate as absolute
          from opfusion import fusion_unseen_source_invariant as invariant
          torch.manual_seed(23)
          existing = torch.randn(4, 41)
          added = torch.randn(1, 41)
          before_features = invariant._source_features(existing)[1:]
          after_features = invariant._source_features(torch.cat([existing, added], dim=0))[1:4]
          assert torch.allclose(before_features, after_features, atol=1e-7, rtol=1e-7)
          scorer = absolute.AbsoluteGateScorer(hidden_size=8)
          scorer.set_normalization(before_features.unsqueeze(0))
          before_gates = scorer.gates_from_logits(existing)
          after_gates = scorer.gates_from_logits(torch.cat([existing, added], dim=0))[:3]
          assert torch.allclose(before_gates, after_gates, atol=1e-7, rtol=1e-7)
          assert torch.all(before_gates >= 0)
          print('absolute gate insertion locality ok')
          PY
      - name: Run absolute-gate leave-one-unit-out pilot
        shell: bash
        run: |
          set +e
          heldout='${{ matrix.heldout }}'
          mkdir -p evaluations/unseen_source_absolute_gate
          python -m opfusion.fusion_unseen_source_absolute_gate \
            --root "$GITHUB_WORKSPACE" \
            --heldout "$heldout" \
            --train-examples-per-operator 24 \
            --max-positions-per-cohort 3072 \
            --train-seed 741000 \
            --scorer-hidden-size 16 \
            --scorer-learning-rate 0.02 \
            --scorer-steps 400 \
            --scorer-batch-positions 256 \
            --scorer-seed 741000 \
            --gate-penalty 0.01 \
            --examples-per-pair 2 \
            --data-seed 741500 \
            --max-new-tokens 64 \
            --device cpu \
            --out "evaluations/unseen_source_absolute_gate/${heldout}.json" \
            > "unseen-source-absolute-${heldout}.log" 2>&1
          status=$?
          echo "$status" > "unseen-source-absolute-${heldout}.status"
          cat "unseen-source-absolute-${heldout}.log"
          exit "$status"
      - name: Post absolute-gate result summary to PR 40
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          heldout='${{ matrix.heldout }}'
          result="evaluations/unseen_source_absolute_gate/${heldout}.json"
          python - "$result" > summary.md <<'PY'
          import json
          import sys
          r = json.load(open(sys.argv[1], encoding='utf-8'))
          h = r['heldout_operator']
          w0 = r['without_heldout_source']
          w1 = r['with_heldout_source']
          d = r['causal_deltas']
          fit = r['scorer_fit']
          print(f"### Absolute-gate unseen-source pilot: `{h}`")
          print()
          print(f"- NLL: `{fit['nll_first']:.6f} -> {fit['nll_last']:.6f}`; mean gate: `{fit['gate_mean_first']:.4f} -> {fit['gate_mean_last']:.4f}`")
          print(f"- held-out inner delta: `{d['heldout_as_inner_inner_accuracy']:+.4f}`")
          print(f"- held-out outer oracle delta: `{d['heldout_as_outer_oracle_outer_accuracy']:+.4f}`")
          print(f"- held-out-involved E2E delta: `{d['heldout_involved_end_to_end_accuracy']:+.4f}`")
          print(f"- held-out-neither E2E delta: `{d['heldout_neither_end_to_end_accuracy']:+.4f}`")
          print(f"- all E2E delta: `{d['all_end_to_end_accuracy']:+.4f}`")
          print(f"- all E2E: `{w0['aggregate']['end_to_end_accuracy']:.4f} -> {w1['aggregate']['end_to_end_accuracy']:.4f}`")
          print()
          print("Specialist gates are independent softplus outputs; adding a source does not change existing specialists' feature vectors or gate values.")
          PY
          gh pr comment 40 --repo Unjuno/math-operator-units --body-file summary.md
      - name: Upload held-out result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-unseen-source-absolute-${{ matrix.heldout }}
          path: |
            unseen-source-absolute-*.log
            unseen-source-absolute-*.status
            evaluations/unseen_source_absolute_gate/*.json
          if-no-files-found: warn
      - name: Enforce experiment success
        if: always()
        shell: bash
        run: test "$(cat unseen-source-absolute-${{ matrix.heldout }}.status)" = "0"
