name: fusion-mixed-novel-plugin-admission

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: fusion-mixed-novel-plugin-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/fusion-unseen-source-generalization.yml
      - src/opfusion/fusion_mixed_novel_plugin_admission.py
      - tests/test_fusion_mixed_novel_plugin_admission.py
      - src/opfusion/fusion_behavioral_admission_seed_replication.py
  workflow_dispatch:

jobs:
  mixed-plugin-pilot:
    strategy:
      fail-fast: false
      matrix:
        heldout:
          - scalar.add
          - aggregation.sum
          - scalar.min
          - scalar.max
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test mixed plugin helpers
        run: pytest -q tests/test_fusion_mixed_novel_plugin_admission.py tests/test_fusion_behavioral_admission_seed_replication.py
      - name: Run mixed novel plugin pilot
        shell: bash
        run: |
          set +e
          heldout='${{ matrix.heldout }}'
          mkdir -p evaluations/mixed_novel_plugin_admission
          python -m opfusion.fusion_mixed_novel_plugin_admission \
            --root "$GITHUB_WORKSPACE" \
            --heldout "$heldout" \
            --scorer-seed 741000 \
            --train-seed 741000 \
            --data-seed 741500 \
            --consensus-power 2.0 \
            --examples-per-pair 2 \
            --max-new-tokens 64 \
            --out "evaluations/mixed_novel_plugin_admission/${heldout}.json" \
            > "mixed-${heldout}.log" 2>&1
          status=$?
          echo "$status" > "mixed-${heldout}.status"
          cat "mixed-${heldout}.log"
          exit "$status"
      - name: Post mixed plugin summary to PR 48
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          heldout='${{ matrix.heldout }}'
          result="evaluations/mixed_novel_plugin_admission/${heldout}.json"
          python - "$result" > summary.md <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1], encoding='utf-8'))
          d=r['correct_count_deltas']; h=r['heldout_operator']
          bm=r['modes']['behavioral_mixed']['diagnostics']
          useful=bm[h]; neg=bm[r['nuisance_source']]
          print(f"### Mixed novel plugins: `{h}` + `scalar.neg`")
          print()
          for key in ('raw_useful_only','behavioral_useful_only','raw_mixed','behavioral_mixed'):
              row=d[key]
              print(f"- `{key}` insertion: involved `{row['heldout_involved']:+d}/42`, neither `{row['heldout_neither']:+d}/54`, net `{row['net']:+d}/96`")
          raw=d['nuisance_marginal_raw']; beh=d['nuisance_marginal_behavioral']
          print(f"- NEG marginal raw: involved `{raw['heldout_involved']:+d}`, neither `{raw['heldout_neither']:+d}`, net `{raw['net']:+d}/96`")
          print(f"- NEG marginal behavioral: involved `{beh['heldout_involved']:+d}`, neither `{beh['heldout_neither']:+d}`, net `{beh['net']:+d}/96`")
          print(f"- useful consensus matching/nonmatching: `{useful['matching_mean_consensus']:.4f}` / `{useful['nonmatching_mean_consensus']:.4f}`; gate `{useful['mean_raw_gate']:.4f} -> {useful['mean_effective_gate']:.4f}`")
          print(f"- NEG mean consensus: `{neg['mean_consensus']:.4f}`; gate `{neg['mean_raw_gate']:.4f} -> {neg['mean_effective_gate']:.4f}`")
          PY
          gh pr comment 48 --repo Unjuno/math-operator-units --body-file summary.md
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mixed-plugin-${{ matrix.heldout }}
          path: |
            mixed-*.log
            mixed-*.status
            evaluations/mixed_novel_plugin_admission/*.json
          if-no-files-found: warn
      - name: Enforce experiment success
        if: always()
        shell: bash
        run: test "$(cat mixed-${{ matrix.heldout }}.status)" = "0"
