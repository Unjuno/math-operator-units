name: fusion-unseen-source-decoy-calibration

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: fusion-unseen-source-decoy-calibration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/fusion-unseen-source-generalization.yml
      - src/opfusion/fusion_unseen_source_decoy_calibration.py
      - tests/test_fusion_unseen_source_decoy_calibration.py
      - src/opfusion/fusion_unseen_source_residual_gating.py
  workflow_dispatch:

jobs:
  decoy-calibration-leave-one-unit-out:
    strategy:
      fail-fast: false
      matrix:
        heldout:
          - scalar.add
          - aggregation.sum
          - scalar.min
          - scalar.max
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test decoy calibration helpers
        run: pytest -q tests/test_fusion_unseen_source_residual_gating.py tests/test_fusion_unseen_source_decoy_calibration.py
      - name: Run cross-prefix decoy calibration pilot
        shell: bash
        run: |
          set +e
          heldout='${{ matrix.heldout }}'
          mkdir -p evaluations/unseen_source_decoy_calibration
          python -m opfusion.fusion_unseen_source_decoy_calibration \
            --root "$GITHUB_WORKSPACE" \
            --heldout "$heldout" \
            --train-examples-per-operator 24 \
            --max-positions-per-cohort 3072 \
            --train-seed 741000 \
            --sketch-size 32 \
            --sketch-seed 743000 \
            --hidden-size 64 \
            --max-gate 4.0 \
            --learning-rate 0.01 \
            --steps 600 \
            --batch-positions 256 \
            --real-gate-penalty 0.01 \
            --decoy-gate-penalty 0.1 \
            --scorer-seed 741000 \
            --examples-per-pair 2 \
            --data-seed 741500 \
            --max-new-tokens 64 \
            --device cpu \
            --out "evaluations/unseen_source_decoy_calibration/${heldout}.json" \
            > "decoy-${heldout}.log" 2>&1
          status=$?
          echo "$status" > "decoy-${heldout}.status"
          cat "decoy-${heldout}.log"
          exit "$status"
      - name: Post decoy summary to PR 43
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          heldout='${{ matrix.heldout }}'
          result="evaluations/unseen_source_decoy_calibration/${heldout}.json"
          python - "$result" > summary.md <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1], encoding='utf-8'))
          h=r['heldout_operator']; fit=r['scorer_fit']; w0=r['without_heldout_source']; w1=r['with_heldout_source']
          inv0=w0['subsets']['heldout_involved']['end_to_end_accuracy']; inv1=w1['subsets']['heldout_involved']['end_to_end_accuracy']
          nei0=w0['subsets']['heldout_neither']['end_to_end_accuracy']; nei1=w1['subsets']['heldout_neither']['end_to_end_accuracy']
          all0=w0['aggregate']['end_to_end_accuracy']; all1=w1['aggregate']['end_to_end_accuracy']
          inn0=w0['subsets']['heldout_as_inner']['inner_accuracy']; inn1=w1['subsets']['heldout_as_inner']['inner_accuracy']
          out0=w0['subsets']['heldout_as_outer']['oracle_intermediate_outer_accuracy']; out1=w1['subsets']['heldout_as_outer']['oracle_intermediate_outer_accuracy']
          print(f"### Cross-prefix decoy calibration: `{h}`")
          print()
          print(f"- train NLL: `{fit['nll_first']:.6f} -> {fit['nll_last']:.6f}`")
          print(f"- real mean gate: `{fit['real_gate_mean_first']:.4f} -> {fit['real_gate_mean_last']:.4f}`; decoy gate: `{fit['decoy_gate_mean_first']:.4f} -> {fit['decoy_gate_mean_last']:.4f}`")
          print(f"- held-out inner: `{inn0:.4f} -> {inn1:.4f}`; outer: `{out0:.4f} -> {out1:.4f}`")
          print(f"- held-out involved E2E: `{inv0:.4f} -> {inv1:.4f}` (delta `{inv1-inv0:+.4f}`)")
          print(f"- held-out neither E2E: `{nei0:.4f} -> {nei1:.4f}` (delta `{nei1-nei0:+.4f}`)")
          print(f"- all 96 E2E: `{all0:.4f} -> {all1:.4f}` (delta `{all1-all0:+.4f}`)")
          PY
          gh pr comment 43 --repo Unjuno/math-operator-units --body-file summary.md
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decoy-${{ matrix.heldout }}
          path: |
            decoy-*.log
            decoy-*.status
            evaluations/unseen_source_decoy_calibration/*.json
          if-no-files-found: warn
      - name: Enforce experiment success
        if: always()
        shell: bash
        run: test "$(cat decoy-${{ matrix.heldout }}.status)" = "0"
