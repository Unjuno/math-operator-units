name: fusion-unseen-source-residual-gating

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: fusion-unseen-source-residual-gating-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/fusion-unseen-source-generalization.yml
      - src/opfusion/fusion_unseen_source_residual_gating.py
      - tests/test_fusion_unseen_source_residual_gating.py
  workflow_dispatch:

jobs:
  residual-gate-leave-one-unit-out:
    strategy:
      fail-fast: false
      matrix:
        heldout:
          - scalar.add
          - aggregation.sum
          - scalar.min
          - scalar.max
        gate_penalty:
          - 0.0
          - 0.01
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test residual gate invariants
        run: pytest -q tests/test_fusion_unseen_source_residual_gating.py
      - name: Run residual gate pilot
        shell: bash
        run: |
          set +e
          heldout='${{ matrix.heldout }}'
          penalty='${{ matrix.gate_penalty }}'
          tag="${heldout}-p${penalty}"
          mkdir -p evaluations/unseen_source_residual_gating
          python -m opfusion.fusion_unseen_source_residual_gating \
            --root "$GITHUB_WORKSPACE" \
            --heldout "$heldout" \
            --train-examples-per-operator 24 \
            --max-positions-per-cohort 3072 \
            --train-seed 741000 \
            --sketch-size 32 \
            --sketch-seed 743000 \
            --hidden-size 64 \
            --max-gate 4.0 \
            --learning-rate 0.01 \
            --steps 600 \
            --batch-positions 256 \
            --gate-penalty "$penalty" \
            --scorer-seed 741000 \
            --examples-per-pair 2 \
            --data-seed 741500 \
            --max-new-tokens 64 \
            --device cpu \
            --out "evaluations/unseen_source_residual_gating/${tag}.json" \
            > "residual-${tag}.log" 2>&1
          status=$?
          echo "$status" > "residual-${tag}.status"
          cat "residual-${tag}.log"
          exit "$status"
      - name: Post residual-gate summary to PR 42
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          heldout='${{ matrix.heldout }}'
          penalty='${{ matrix.gate_penalty }}'
          tag="${heldout}-p${penalty}"
          result="evaluations/unseen_source_residual_gating/${tag}.json"
          python - "$result" > summary.md <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1], encoding='utf-8'))
          h=r['heldout_operator']; fit=r['scorer_fit']; w0=r['without_heldout_source']; w1=r['with_heldout_source']
          inv0=w0['subsets']['heldout_involved']['end_to_end_accuracy']; inv1=w1['subsets']['heldout_involved']['end_to_end_accuracy']
          nei0=w0['subsets']['heldout_neither']['end_to_end_accuracy']; nei1=w1['subsets']['heldout_neither']['end_to_end_accuracy']
          all0=w0['aggregate']['end_to_end_accuracy']; all1=w1['aggregate']['end_to_end_accuracy']
          inn0=w0['subsets']['heldout_as_inner']['inner_accuracy']; inn1=w1['subsets']['heldout_as_inner']['inner_accuracy']
          out0=w0['subsets']['heldout_as_outer']['oracle_intermediate_outer_accuracy']; out1=w1['subsets']['heldout_as_outer']['oracle_intermediate_outer_accuracy']
          print(f"### Residual gate: `{h}`, penalty `{fit['gate_penalty']}`")
          print()
          print(f"- train NLL: `{fit['nll_first']:.6f} -> {fit['nll_last']:.6f}`; mean gate `{fit['mean_gate_first']:.4f} -> {fit['mean_gate_last']:.4f}`")
          print(f"- held-out inner: `{inn0:.4f} -> {inn1:.4f}`; outer: `{out0:.4f} -> {out1:.4f}`")
          print(f"- held-out involved E2E: `{inv0:.4f} -> {inv1:.4f}` (delta `{inv1-inv0:+.4f}`)")
          print(f"- held-out neither E2E: `{nei0:.4f} -> {nei1:.4f}` (delta `{nei1-nei0:+.4f}`)")
          print(f"- all 96 E2E: `{all0:.4f} -> {all1:.4f}` (delta `{all1-all0:+.4f}`)")
          PY
          gh pr comment 42 --repo Unjuno/math-operator-units --body-file summary.md
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: residual-${{ matrix.heldout }}-p${{ matrix.gate_penalty }}
          path: |
            residual-*.log
            residual-*.status
            evaluations/unseen_source_residual_gating/*.json
          if-no-files-found: warn
      - name: Enforce experiment success
        if: always()
        shell: bash
        run: |
          heldout='${{ matrix.heldout }}'
          penalty='${{ matrix.gate_penalty }}'
          test "$(cat residual-${heldout}-p${penalty}.status)" = "0"
