name: fusion-cross-source-behavioral-consensus

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: fusion-cross-source-behavioral-consensus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/fusion-unseen-source-generalization.yml
      - src/opfusion/fusion_cross_source_behavioral_consensus.py
      - tests/test_fusion_cross_source_behavioral_consensus.py
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test cross-source consensus helpers
        run: pytest -q tests/test_fusion_cross_source_behavioral_consensus.py
      - name: Run cross-source behavioral consensus diagnostic
        shell: bash
        run: |
          set +e
          mkdir -p evaluations/cross_source_behavioral_consensus
          python -m opfusion.fusion_cross_source_behavioral_consensus \
            --root "$GITHUB_WORKSPACE" \
            --examples-per-operator 6 \
            --data-seed 747000 \
            --max-new-tokens 64 \
            --out evaluations/cross_source_behavioral_consensus/diagnostic.json \
            > cross-source-consensus.log 2>&1
          status=$?
          echo "$status" > cross-source-consensus.status
          cat cross-source-consensus.log
          exit "$status"
      - name: Post diagnostic summary to PR 50
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=evaluations/cross_source_behavioral_consensus/diagnostic.json
          python - "$result" > summary.md <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1], encoding='utf-8'))
          s=r['score_summary']; sel=r['selection_summary']
          print('### Cross-source behavioral consensus diagnostic')
          print()
          print(f"- rows: `{s['rows']}`; correct `{s['positive_rows']}`, incorrect `{s['negative_rows']}`")
          print(f"- consensus=1 rows: `{s['consensus_one_rows']}`; correct `{s['consensus_one_positive_rows']}`, stable-wrong `{s['consensus_one_negative_rows']}`")
          for key in ('consensus','peer_support','peer_support_weighted','consensus_x_peer','consensus_x_weighted_peer'):
              row=s['scores'][key]
              print(f"- `{key}` AUC all / consensus=1: `{row['auc_all']}` / `{row['auc_consensus_one']}`")
          print()
          for key in ('consensus','consensus_x_peer','consensus_x_weighted_peer'):
              row=sel[key]
              print(f"- top `{key}`: contains-correct `{row['top_set_contains_correct_rate']:.4f}`, all-top-correct `{row['all_top_sources_correct_rate']:.4f}`, matching-in-top `{row['matching_specialist_in_top_rate']:.4f}`, matching-strict-top `{row['matching_specialist_strict_top_rate']:.4f}`")
          print()
          print('Scores use no correctness label, source semantic identity, or operator identity; those labels are posthoc diagnostics only.')
          PY
          gh pr comment 50 --repo Unjuno/math-operator-units --body-file summary.md
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-source-behavioral-consensus
          path: |
            cross-source-consensus.log
            cross-source-consensus.status
            evaluations/cross_source_behavioral_consensus/diagnostic.json
          if-no-files-found: warn
      - name: Enforce diagnostic success
        if: always()
        run: test "$(cat cross-source-consensus.status)" = "0"
