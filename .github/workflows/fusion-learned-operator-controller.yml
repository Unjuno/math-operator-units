name: fusion-learned-operator-controller

concurrency:
  group: fusion-learned-operator-controller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/fusion-learned-operator-controller.yml
      - src/opfusion/fusion_learned_operator_controller.py
      - tests/test_fusion_learned_operator_controller.py
      - src/opfusion/fusion_oracle_sequential_composition.py
      - src/opfusion/fusion_stateful_oracle_operator.py
  workflow_dispatch:

jobs:
  learned-operator-controller:
    strategy:
      fail-fast: false
      matrix:
        strength: ['0.0', '0.5', '1.0', '2.0', '4.0']
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test learned controller helpers
        run: >-
          pytest -q
          tests/test_fusion_learned_operator_controller.py
          tests/test_fusion_oracle_sequential_composition.py
          tests/test_fusion_stateful_oracle_operator.py
      - name: Run learned controller composition
        shell: bash
        env:
          OPFUSION_MIXER_ENSEMBLE_MODE: arithmetic
          OPFUSION_LEARNED_CONTROLLER_STRENGTH: ${{ matrix.strength }}
        run: |
          set +e
          tag="$(echo '${{ matrix.strength }}' | tr '.' '_')"
          python -m opfusion.fusion_learned_operator_controller \
            --root "$GITHUB_WORKSPACE" \
            --examples-per-pair 4 \
            --data-seed 733000 \
            --calibration-examples-per-operator 8 \
            --max-prefixes-per-example 24 \
            --max-positions-per-cohort 1536 \
            --fit-steps 500 \
            --fit-batch-positions 96 \
            --hidden-size 16 \
            --sketch-size 8 \
            --learning-rate 0.01 \
            --calibration-seed 731000 \
            --controller-train-examples-per-operator 64 \
            --controller-holdout-examples-per-operator 32 \
            --controller-seed 737000 \
            --controller-holdout-seed 737500 \
            --controller-embedding-size 16 \
            --controller-hidden-size 16 \
            --controller-learning-rate 0.03 \
            --controller-steps 300 \
            --device cpu \
            --out "evaluations/learned_operator_controller/strength-${tag}.json" \
            > "learned-controller-${tag}.log" 2>&1
          status=$?
          echo "$status" > "learned-controller-${tag}.status"
          cat "learned-controller-${tag}.log"
          exit "$status"
      - name: Print learned controller result
        if: always()
        shell: bash
        run: |
          tag="$(echo '${{ matrix.strength }}' | tr '.' '_')"
          python - <<PY
          import json
          from pathlib import Path

          strength = '${{ matrix.strength }}'
          path = Path('evaluations/learned_operator_controller/strength-' + '${tag}' + '.json')
          if path.is_file():
              report = json.loads(path.read_text())
              print(json.dumps({
                  'strength': strength,
                  'controller_fit': report.get('controller_fit'),
                  'composition_prompt_controller': report.get('composition_prompt_controller'),
                  'mean_matching_source_weight': report.get('mean_matching_source_weight'),
                  'aggregate': report.get('aggregate'),
              }, indent=2, sort_keys=True))
          PY
      - name: Upload learned controller result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-learned-operator-controller-${{ matrix.strength }}
          path: |
            learned-controller-*.log
            learned-controller-*.status
            evaluations/learned_operator_controller/*.json
          if-no-files-found: warn
      - name: Enforce experiment run success
        if: always()
        shell: bash
        run: |
          tag="$(echo '${{ matrix.strength }}' | tr '.' '_')"
          test "$(cat "learned-controller-${tag}.status")" = "0"
