name: fusion-learned-operator-controller

concurrency:
  group: fusion-learned-operator-controller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/fusion-learned-operator-controller.yml
      - src/opfusion/fusion_learned_operator_controller.py
      - tests/test_fusion_learned_operator_controller.py
  workflow_dispatch:

jobs:
  learned-operator-controller:
    strategy:
      fail-fast: false
      matrix:
        feature_mode: ['full', 'masked']
        strength: ['0.5', '1.0', '2.0']
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test controller helpers
        run: >-
          pytest -q
          tests/test_fusion_learned_operator_controller.py
          tests/test_fusion_oracle_sequential_composition.py
          tests/test_fusion_stateful_oracle_operator.py
      - name: Run learned controller composition
        shell: bash
        env:
          OPFUSION_MIXER_ENSEMBLE_MODE: arithmetic
          OPFUSION_CONTROLLER_FEATURE_MODE: ${{ matrix.feature_mode }}
          OPFUSION_CONTROLLER_OPERATOR_STRENGTH: ${{ matrix.strength }}
        run: |
          set +e
          strength_tag="$(echo '${{ matrix.strength }}' | tr '.' '_')"
          tag="${{ matrix.feature_mode }}-${strength_tag}"
          python -m opfusion.fusion_learned_operator_controller \
            --root "$GITHUB_WORKSPACE" \
            --examples-per-pair 4 \
            --data-seed 733000 \
            --calibration-examples-per-operator 8 \
            --max-prefixes-per-example 24 \
            --max-positions-per-cohort 1536 \
            --fit-steps 500 \
            --fit-batch-positions 96 \
            --hidden-size 16 \
            --sketch-size 8 \
            --learning-rate 0.01 \
            --calibration-seed 731000 \
            --controller-seed 734000 \
            --controller-examples-per-operator 64 \
            --controller-validation-examples-per-operator 32 \
            --controller-steps 300 \
            --controller-learning-rate 0.02 \
            --device cpu \
            --out "evaluations/learned_operator_controller/${tag}.json" \
            > "controller-${tag}.log" 2>&1
          status=$?
          echo "$status" > "controller-${tag}.status"
          cat "controller-${tag}.log"
          exit "$status"
      - name: Print controller result
        if: always()
        shell: bash
        run: |
          strength_tag="$(echo '${{ matrix.strength }}' | tr '.' '_')"
          tag="${{ matrix.feature_mode }}-${strength_tag}"
          python - <<PY
          import json
          from pathlib import Path

          path = Path('evaluations/learned_operator_controller/${tag}.json')
          if path.is_file():
              report = json.loads(path.read_text())
              print(json.dumps({
                  'feature_mode': report.get('controller_feature_mode'),
                  'strength': report.get('controller_operator_strength'),
                  'controller_fit_validation': report.get('controller_fit', {}).get('validation'),
                  'controller_stage_accuracy': report.get('controller_stage_accuracy'),
                  'controller_mean_confidence': report.get('controller_mean_confidence'),
                  'mean_matching_source_weight': report.get('mean_matching_source_weight'),
                  'aggregate': report.get('aggregate'),
              }, indent=2, sort_keys=True))
          PY
      - name: Upload controller result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-learned-operator-controller-${{ matrix.feature_mode }}-${{ matrix.strength }}
          path: |
            controller-*.log
            controller-*.status
            evaluations/learned_operator_controller/*.json
          if-no-files-found: warn
      - name: Enforce controller run success
        if: always()
        shell: bash
        run: |
          strength_tag="$(echo '${{ matrix.strength }}' | tr '.' '_')"
          tag="${{ matrix.feature_mode }}-${strength_tag}"
          test "$(cat "controller-${tag}.status")" = "0"
