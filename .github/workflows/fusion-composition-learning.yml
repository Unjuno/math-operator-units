name: fusion-composition-learning

on:
  pull_request:
    paths:
      - .github/workflows/fusion-composition-learning.yml
      - src/opfusion/fusion_compose.py
      - tests/test_fusion_compose.py
      - pyproject.toml
      - runs/gpt_bias_fusion_factory_surface_v3/**
  workflow_dispatch:

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test compositor
        run: pytest -q tests/test_fusion_compose.py
      - name: Learn and verify static all-five composition laws
        id: compose
        continue-on-error: true
        shell: bash
        run: |
          set +e
          opfusion-learn-fusion-compositor \
            --calibration-examples-per-operator 12 \
            --verification-examples-per-operator 24 \
            --max-calibration-positions-per-cohort 1536 \
            --fit-steps 220 \
            --fit-batch-positions 96 \
            --learning-rate 0.03 \
            --l2-weight 0.001 \
            --calibration-seed 705000 \
            --verification-seed 706000 \
            --max-new-tokens 64 \
            --device cpu \
            --out evaluations/fusion_composition_learning/summary.json \
            > fusion-compose.log 2>&1
          status=$?
          echo "$status" > fusion-compose.status
          cat fusion-compose.log
          exit "$status"
      - name: Print learned composition result
        if: steps.compose.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('evaluations/fusion_composition_learning/summary.json').read_text())
          print(json.dumps(report.get('recommended_validation_composition'), indent=2, sort_keys=True))
          print(json.dumps(report.get('fit_reports'), indent=2, sort_keys=True))
          PY
      - name: Upload composition result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-composition-learning
          path: |
            fusion-compose.log
            fusion-compose.status
            evaluations/fusion_composition_learning/summary.json
          if-no-files-found: warn
      - name: Enforce composition run success
        if: always()
        run: test "$(cat fusion-compose.status)" = "0"
