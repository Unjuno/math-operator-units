name: fusion-nested-expression-structural-planner

on:
  pull_request:
    paths:
      - .github/workflows/fusion-nested-expression-structural-planner.yml
      - src/opfusion/fusion_nested_expression_structural_planner.py
      - tests/test_fusion_nested_expression_structural_planner.py
  workflow_dispatch:

jobs:
  nested-structural-planner:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_fusion_nested_expression_structural_planner.py tests/test_fusion_posterior_transition_boundary_gate.py tests/test_fusion_learned_operator_controller.py
      - name: Evaluate one-prompt nested execution
        env:
          OPFUSION_MIXER_ENSEMBLE_MODE: arithmetic
          OPFUSION_CONTROLLER_FEATURE_MODE: full
          OPFUSION_CONTROLLER_OPERATOR_STRENGTH: '1.0'
          OPFUSION_POSTERIOR_GATE_MODE: dynamic
          OPFUSION_POSTERIOR_GATE_SCALE: '1.0'
        run: |
          python -m opfusion.fusion_nested_expression_structural_planner \
            --root "$GITHUB_WORKSPACE" \
            --examples-per-pair 4 \
            --data-seed 733000 \
            --calibration-examples-per-operator 8 \
            --max-prefixes-per-example 24 \
            --max-positions-per-cohort 1536 \
            --fit-steps 500 \
            --fit-batch-positions 96 \
            --hidden-size 16 \
            --sketch-size 8 \
            --learning-rate 0.01 \
            --calibration-seed 731000 \
            --controller-seed 734000 \
            --controller-examples-per-operator 64 \
            --controller-validation-examples-per-operator 32 \
            --controller-steps 300 \
            --controller-learning-rate 0.02 \
            --device cpu \
            --out evaluations/nested_expression_structural_planner/result.json
      - name: Show result
        run: cat evaluations/nested_expression_structural_planner/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: fusion-nested-expression-structural-planner
          path: evaluations/nested_expression_structural_planner/result.json
