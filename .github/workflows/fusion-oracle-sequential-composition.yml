name: fusion-oracle-sequential-composition

concurrency:
  group: fusion-oracle-sequential-composition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/fusion-oracle-sequential-composition.yml
      - src/opfusion/fusion_oracle_sequential_composition.py
      - tests/test_fusion_oracle_sequential_composition.py
  workflow_dispatch:

jobs:
  oracle-sequential-composition:
    strategy:
      fail-fast: false
      matrix:
        strength: ['0.0', '0.5', '2.0', '4.0']
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test sequential composition helpers
        run: >-
          pytest -q
          tests/test_fusion_oracle_sequential_composition.py
          tests/test_fusion_stateful_oracle_operator.py
      - name: Run sequential composition
        shell: bash
        env:
          OPFUSION_MIXER_ENSEMBLE_MODE: arithmetic
          OPFUSION_ORACLE_OPERATOR_STRENGTH: ${{ matrix.strength }}
        run: |
          set +e
          tag="$(echo '${{ matrix.strength }}' | tr '.' '_')"
          python -m opfusion.fusion_oracle_sequential_composition \
            --examples-per-pair 4 \
            --data-seed 733000 \
            --calibration-examples-per-operator 8 \
            --max-prefixes-per-example 24 \
            --max-positions-per-cohort 1536 \
            --fit-steps 500 \
            --fit-batch-positions 96 \
            --hidden-size 16 \
            --sketch-size 8 \
            --learning-rate 0.01 \
            --calibration-seed 731000 \
            --device cpu \
            --out "evaluations/oracle_sequential_composition/strength-${tag}.json" \
            > "sequential-${tag}.log" 2>&1
          status=$?
          echo "$status" > "sequential-${tag}.status"
          cat "sequential-${tag}.log"
          exit "$status"
      - name: Print composition result
        if: always()
        shell: bash
        run: |
          tag="$(echo '${{ matrix.strength }}' | tr '.' '_')"
          python - <<PY
          import json
          from pathlib import Path

          strength = '${{ matrix.strength }}'
          path = Path('evaluations/oracle_sequential_composition/strength-' + '${tag}' + '.json')
          if path.is_file():
              report = json.loads(path.read_text())
              print(json.dumps({
                  'strength': strength,
                  'aggregate': report.get('aggregate'),
                  'mean_matching_source_weight': report.get('mean_matching_source_weight'),
              }, indent=2, sort_keys=True))
          PY
      - name: Upload composition result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-oracle-sequential-composition-${{ matrix.strength }}
          path: |
            sequential-*.log
            sequential-*.status
            evaluations/oracle_sequential_composition/*.json
          if-no-files-found: warn
      - name: Enforce composition run success
        if: always()
        shell: bash
        run: |
          tag="$(echo '${{ matrix.strength }}' | tr '.' '_')"
          test "$(cat "sequential-${tag}.status")" = "0"
