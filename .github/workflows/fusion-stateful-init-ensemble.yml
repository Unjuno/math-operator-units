name: fusion-stateful-init-ensemble

concurrency:
  group: fusion-stateful-init-ensemble-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/fusion-stateful-init-ensemble.yml
      - src/opfusion/fusion_stateful_dual_timescale_init_ensemble.py
      - src/opfusion/fusion_stateful_dual_timescale_confirmatory_deterministic.py
      - tests/test_fusion_stateful_dual_timescale_init_ensemble.py
  workflow_dispatch:

jobs:
  ensemble:
    strategy:
      fail-fast: false
      matrix:
        mode: [arithmetic, geometric]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test continuous ensemble
        run: pytest -q tests/test_fusion_stateful_dual_timescale_init_ensemble.py tests/test_fusion_stateful_dual_timescale_deterministic.py
      - name: Run five-mixer continuous ensemble
        shell: bash
        env:
          OPFUSION_MIXER_ENSEMBLE_MODE: ${{ matrix.mode }}
        run: |
          set +e
          python -m opfusion.fusion_stateful_dual_timescale_init_ensemble \
            --calibration-examples-per-operator 8 \
            --max-prefixes-per-example 24 \
            --max-positions-per-cohort 1536 \
            --fit-steps 500 \
            --fit-batch-positions 96 \
            --state-search-examples-per-operator 1 \
            --verification-examples-per-operator 24 \
            --maximum-verification-candidates 3 \
            --hidden-size 16 \
            --sketch-size 8 \
            --learning-rate 0.01 \
            --calibration-seed 731000 \
            --state-search-seed 731500 \
            --verification-seed 732000 \
            --device cpu \
            --out evaluations/fusion_stateful_init_ensemble/${{ matrix.mode }}.json \
            > ensemble-${{ matrix.mode }}.log 2>&1
          status=$?
          echo "$status" > ensemble-${{ matrix.mode }}.status
          cat ensemble-${{ matrix.mode }}.log
          exit "$status"
      - name: Print ensemble result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          mode = '${{ matrix.mode }}'
          path = Path(f'evaluations/fusion_stateful_init_ensemble/{mode}.json')
          if path.is_file():
              report = json.loads(path.read_text())
              print(json.dumps({
                  'mode': mode,
                  'ranked_methods': report.get('ranked_methods'),
                  'recommended': report.get('recommended_validation_composition'),
              }, indent=2, sort_keys=True))
          PY
      - name: Upload ensemble result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-stateful-init-ensemble-${{ matrix.mode }}
          path: |
            ensemble-${{ matrix.mode }}.log
            ensemble-${{ matrix.mode }}.status
            evaluations/fusion_stateful_init_ensemble/${{ matrix.mode }}.json
          if-no-files-found: warn
      - name: Enforce ensemble success
        if: always()
        run: test "$(cat ensemble-${{ matrix.mode }}.status)" = "0"
