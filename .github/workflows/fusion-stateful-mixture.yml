name: fusion-stateful-mixture

on:
  pull_request:
    paths:
      - .github/workflows/fusion-stateful-mixture.yml
      - src/opfusion/fusion_stateful_mixture.py
      - src/opfusion/fusion_stateful_mixture_fine.py
      - src/opfusion/fusion_validity_mixture.py
      - src/opfusion/fusion_sparse_valid.py
      - src/opfusion/fusion_verify.py
      - tests/test_fusion_stateful_mixture.py
      - runs/gpt_bias_fusion_factory_surface_v3/**
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test stateful mixture
        run: pytest -q tests/test_fusion_stateful_mixture.py
      - name: Search persistent continuous mixtures
        shell: bash
        run: |
          set +e
          python -m opfusion.fusion_stateful_mixture_fine \
            --calibration-examples-per-operator 10 \
            --max-prefixes-per-example 32 \
            --max-positions-per-cohort 2048 \
            --fit-steps 700 \
            --fit-batch-positions 128 \
            --state-search-examples-per-operator 4 \
            --verification-examples-per-operator 12 \
            --maximum-verification-candidates 5 \
            --hidden-size 16 \
            --sketch-size 8 \
            --learning-rate 0.01 \
            --calibration-seed 723000 \
            --state-search-seed 723500 \
            --verification-seed 724000 \
            --device cpu \
            --out evaluations/fusion_stateful_mixture/summary.json \
            > fusion-stateful-mixture.log 2>&1
          status=$?
          echo "$status" > fusion-stateful-mixture.status
          cat fusion-stateful-mixture.log
          exit "$status"
      - name: Print compact result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('evaluations/fusion_stateful_mixture/summary.json')
          if path.is_file():
              report = json.loads(path.read_text())
              print(json.dumps({
                  'selected_candidates': report.get('selected_candidates'),
                  'recommended': report.get('recommended_validation_composition'),
                  'passing_methods': report.get('passing_methods'),
              }, indent=2, sort_keys=True))
          PY
      - name: Upload stateful-mixture result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-stateful-mixture
          path: |
            fusion-stateful-mixture.log
            fusion-stateful-mixture.status
            evaluations/fusion_stateful_mixture/summary.json
          if-no-files-found: warn
      - name: Enforce search success
        if: always()
        run: test "$(cat fusion-stateful-mixture.status)" = "0"
