name: fusion-timescale-specific-boundary-reset

concurrency:
  group: fusion-timescale-specific-boundary-reset-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/fusion-timescale-specific-boundary-reset.yml
      - src/opfusion/fusion_timescale_specific_boundary_reset.py
      - tests/test_fusion_timescale_specific_boundary_reset.py
  workflow_dispatch:

jobs:
  timescale-specific-reset:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: both-reset
            fast_reset: '1.0'
            slow_reset: '1.0'
          - label: fast-reset-slow-carry
            fast_reset: '1.0'
            slow_reset: '0.0'
          - label: fast-carry-slow-reset
            fast_reset: '0.0'
            slow_reset: '1.0'
          - label: both-carry
            fast_reset: '0.0'
            slow_reset: '0.0'
          - label: fast-reset-slow-half
            fast_reset: '1.0'
            slow_reset: '0.5'
          - label: fast-half-slow-reset
            fast_reset: '0.5'
            slow_reset: '1.0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test timescale reset helpers
        run: >-
          pytest -q
          tests/test_fusion_timescale_specific_boundary_reset.py
          tests/test_fusion_controller_state_boundary_carry.py
          tests/test_fusion_learned_operator_controller.py
      - name: Run timescale-specific reset
        shell: bash
        env:
          OPFUSION_MIXER_ENSEMBLE_MODE: arithmetic
          OPFUSION_CONTROLLER_FEATURE_MODE: full
          OPFUSION_CONTROLLER_OPERATOR_STRENGTH: '1.0'
          OPFUSION_FAST_BOUNDARY_RESET: ${{ matrix.fast_reset }}
          OPFUSION_SLOW_BOUNDARY_RESET: ${{ matrix.slow_reset }}
        run: |
          set +e
          label='${{ matrix.label }}'
          python -m opfusion.fusion_timescale_specific_boundary_reset \
            --root "$GITHUB_WORKSPACE" \
            --examples-per-pair 4 \
            --data-seed 733000 \
            --calibration-examples-per-operator 8 \
            --max-prefixes-per-example 24 \
            --max-positions-per-cohort 1536 \
            --fit-steps 500 \
            --fit-batch-positions 96 \
            --hidden-size 16 \
            --sketch-size 8 \
            --learning-rate 0.01 \
            --calibration-seed 731000 \
            --controller-seed 734000 \
            --controller-examples-per-operator 64 \
            --controller-validation-examples-per-operator 32 \
            --controller-steps 300 \
            --controller-learning-rate 0.02 \
            --device cpu \
            --out "evaluations/timescale_specific_boundary_reset/${label}.json" \
            > "timescale-${label}.log" 2>&1
          status=$?
          echo "$status" > "timescale-${label}.status"
          cat "timescale-${label}.log"
          exit "$status"
      - name: Print result
        if: always()
        shell: bash
        run: |
          label='${{ matrix.label }}'
          python - <<PY
          import json
          from pathlib import Path
          path = Path('evaluations/timescale_specific_boundary_reset/${label}.json')
          if path.is_file():
              report = json.loads(path.read_text())
              print(json.dumps({
                  'label': '${{ matrix.label }}',
                  'fast_reset': report.get('fast_boundary_reset'),
                  'slow_reset': report.get('slow_boundary_reset'),
                  'controller_stage_accuracy': report.get('controller_stage_accuracy'),
                  'mean_matching_source_weight': report.get('mean_matching_source_weight'),
                  'mean_boundary_state_shift': report.get('mean_boundary_state_shift'),
                  'aggregate': report.get('aggregate'),
              }, indent=2, sort_keys=True))
          PY
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-timescale-specific-boundary-reset-${{ matrix.label }}
          path: |
            timescale-*.log
            timescale-*.status
            evaluations/timescale_specific_boundary_reset/*.json
          if-no-files-found: warn
      - name: Enforce run success
        if: always()
        shell: bash
        run: |
          label='${{ matrix.label }}'
          test "$(cat "timescale-${label}.status")" = "0"
