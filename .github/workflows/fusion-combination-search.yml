name: fusion-combination-search

on:
  pull_request:
    paths:
      - .github/workflows/fusion-combination-search.yml
      - src/opfusion/fusion_search.py
      - pyproject.toml
      - runs/gpt_bias_fusion_factory_surface_v3/**
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Search validation combinations
        id: search
        continue-on-error: true
        shell: bash
        run: |
          set +e
          opfusion-search-fusion-combinations \
            --source fusion-factory \
            --examples-per-operator 32 \
            --evaluation-seed 703000 \
            --device cpu \
            --out evaluations/fusion_combination_search/summary.json \
            > fusion-search.log 2>&1
          status=$?
          echo "$status" > fusion-search.status
          cat fusion-search.log
          exit "$status"
      - name: Print recommended candidate
        if: steps.search.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('evaluations/fusion_combination_search/summary.json').read_text())
          print(json.dumps(report.get('recommended_all_five_validation_candidate'), indent=2, sort_keys=True))
          print('cohorts=', len(report.get('cohorts', [])))
          print('rows=', len(report.get('rows', [])))
          PY
      - name: Upload search diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-combination-search
          path: |
            fusion-search.log
            fusion-search.status
            evaluations/fusion_combination_search/summary.json
          if-no-files-found: warn
      - name: Enforce search success
        if: always()
        run: test "$(cat fusion-search.status)" = "0"
