name: fusion-combination-search

on:
  pull_request:
    paths:
      - .github/workflows/fusion-combination-search.yml
      - src/opfusion/fusion_search.py
      - src/opfusion/fusion_verify.py
      - src/opfusion/fusion_compose.py
      - tests/test_fusion_search.py
      - tests/test_fusion_verify.py
      - tests/test_fusion_compose.py
      - pyproject.toml
      - runs/gpt_bias_fusion_factory_surface_v3/**
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test fusion search, verification, and composition helpers
        run: pytest -q tests/test_fusion_search.py tests/test_fusion_verify.py tests/test_fusion_compose.py
      - name: Search validation combinations
        id: search
        continue-on-error: true
        shell: bash
        run: |
          set +e
          opfusion-search-fusion-combinations \
            --source fusion-factory \
            --examples-per-operator 32 \
            --evaluation-seed 703000 \
            --device cpu \
            --out evaluations/fusion_combination_search/summary.json \
            > fusion-search.log 2>&1
          status=$?
          echo "$status" > fusion-search.status
          cat fusion-search.log
          exit "$status"
      - name: Verify selected static candidates autoregressively
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          opfusion-verify-fusion-combinations \
            --examples-per-operator 32 \
            --evaluation-seed 704000 \
            --max-new-tokens 64 \
            --device cpu \
            --out evaluations/fusion_combination_search/autoregressive_verification.json \
            > fusion-verify.log 2>&1
          status=$?
          echo "$status" > fusion-verify.status
          cat fusion-verify.log
          exit "$status"
      - name: Learn and verify all-five algebraic composition laws
        id: compose
        continue-on-error: true
        shell: bash
        run: |
          set +e
          opfusion-learn-fusion-compositor \
            --calibration-examples-per-operator 8 \
            --verification-examples-per-operator 16 \
            --max-calibration-positions-per-cohort 1024 \
            --fit-steps 160 \
            --fit-batch-positions 96 \
            --learning-rate 0.03 \
            --l2-weight 0.001 \
            --calibration-seed 705000 \
            --verification-seed 706000 \
            --max-new-tokens 64 \
            --device cpu \
            --out evaluations/fusion_composition_learning/summary.json \
            > fusion-compose.log 2>&1
          status=$?
          echo "$status" > fusion-compose.status
          cat fusion-compose.log
          exit "$status"
      - name: Print recommendations
        if: steps.search.outcome == 'success' && steps.verify.outcome == 'success' && steps.compose.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          broad = json.loads(Path('evaluations/fusion_combination_search/summary.json').read_text())
          verify = json.loads(Path('evaluations/fusion_combination_search/autoregressive_verification.json').read_text())
          compose = json.loads(Path('evaluations/fusion_composition_learning/summary.json').read_text())
          print('broad_all_five=')
          print(json.dumps(broad.get('recommended_all_five_validation_candidate'), indent=2, sort_keys=True))
          print('static_autoregressive_recommended=')
          print(json.dumps(verify.get('recommended_candidate'), indent=2, sort_keys=True))
          print('learned_composition_recommended=')
          print(json.dumps(compose.get('recommended_validation_composition'), indent=2, sort_keys=True))
          print('learned_composition_parameters=')
          print(json.dumps({key: value.get('parameters') for key, value in compose.get('fit_reports', {}).items()}, indent=2, sort_keys=True))
          PY
      - name: Upload search diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-combination-search
          path: |
            fusion-search.log
            fusion-search.status
            fusion-verify.log
            fusion-verify.status
            fusion-compose.log
            fusion-compose.status
            evaluations/fusion_combination_search/summary.json
            evaluations/fusion_combination_search/autoregressive_verification.json
            evaluations/fusion_composition_learning/summary.json
          if-no-files-found: warn
      - name: Enforce search success
        if: always()
        run: |
          test "$(cat fusion-search.status)" = "0"
          test "$(cat fusion-verify.status)" = "0"
          test "$(cat fusion-compose.status)" = "0"
