name: fusion-recursive-depth3-confirmatory

on:
  pull_request:
    paths:
      - .github/workflows/fusion-recursive-depth3-confirmatory.yml
      - src/opfusion/fusion_recursive_depth3_composition.py
  workflow_dispatch:

jobs:
  confirm-depth3:
    strategy:
      fail-fast: false
      matrix:
        data_seed: ['735001', '735002', '735003']
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_fusion_recursive_depth3_composition.py tests/test_fusion_posterior_transition_boundary_gate.py
      - name: Evaluate independent depth-3 data seed
        env:
          OPFUSION_MIXER_ENSEMBLE_MODE: arithmetic
          OPFUSION_CONTROLLER_FEATURE_MODE: full
          OPFUSION_CONTROLLER_OPERATOR_STRENGTH: '1.0'
          OPFUSION_POSTERIOR_GATE_MODE: dynamic
          OPFUSION_POSTERIOR_GATE_SCALE: '1.0'
        run: |
          python -m opfusion.fusion_recursive_depth3_composition \
            --root "$GITHUB_WORKSPACE" \
            --examples-per-triple 1 \
            --data-seed '${{ matrix.data_seed }}' \
            --calibration-examples-per-operator 8 \
            --max-prefixes-per-example 24 \
            --max-positions-per-cohort 1536 \
            --fit-steps 500 \
            --fit-batch-positions 96 \
            --hidden-size 16 \
            --sketch-size 8 \
            --learning-rate 0.01 \
            --calibration-seed 731000 \
            --controller-seed 734000 \
            --controller-examples-per-operator 64 \
            --controller-validation-examples-per-operator 32 \
            --controller-steps 300 \
            --controller-learning-rate 0.02 \
            --device cpu \
            --out "evaluations/recursive_depth3_confirmatory/seed-${{ matrix.data_seed }}.json"
      - name: Print result
        run: |
          python - <<PY
          import json
          from pathlib import Path
          path = Path('evaluations/recursive_depth3_confirmatory/seed-${{ matrix.data_seed }}.json')
          report = json.loads(path.read_text())
          print(json.dumps({
              'data_seed': report['data_seed'],
              'aggregate': report['aggregate'],
              'by_transition_count': report['by_transition_count'],
          }, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fusion-recursive-depth3-confirmatory-${{ matrix.data_seed }}
          path: evaluations/recursive_depth3_confirmatory/seed-${{ matrix.data_seed }}.json
