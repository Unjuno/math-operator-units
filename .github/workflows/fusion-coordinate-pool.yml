name: fusion-coordinate-pool

on:
  pull_request:
    paths:
      - .github/workflows/fusion-coordinate-pool.yml
      - src/opfusion/fusion_coordinate_pool.py
      - src/opfusion/fusion_sparse_valid.py
      - tests/test_fusion_coordinate_pool.py
      - runs/gpt_bias_fusion_factory_surface_v3/**
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test coordinate pooling
        run: pytest -q tests/test_fusion_coordinate_pool.py tests/test_fusion_sparse_valid.py
      - name: Search coordinate-wise robust composition laws
        id: search
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m opfusion.fusion_coordinate_pool \
            --calibration-examples-per-operator 3 \
            --max-prefixes-per-example 24 \
            --max-positions-per-cohort 512 \
            --verification-examples-per-operator 8 \
            --maximum-autoregressive-candidates 6 \
            --calibration-seed 713000 \
            --holdout-seed 713500 \
            --verification-seed 714000 \
            --max-new-tokens 64 \
            --device cpu \
            --out evaluations/fusion_coordinate_pool/summary.json \
            > fusion-coordinate-pool.log 2>&1
          status=$?
          echo "$status" > fusion-coordinate-pool.status
          cat fusion-coordinate-pool.log
          exit "$status"
      - name: Print compact result
        if: steps.search.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('evaluations/fusion_coordinate_pool/summary.json').read_text())
          print('oracle=')
          print(json.dumps(report['holdout_oracle'], indent=2, sort_keys=True))
          print('autoregressive_candidates=')
          print(json.dumps(report['autoregressive_candidates'], indent=2, sort_keys=True))
          print('ranked_methods=')
          print(json.dumps(report['ranked_methods'], indent=2, sort_keys=True))
          PY
      - name: Upload coordinate pooling result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-coordinate-pool
          path: |
            fusion-coordinate-pool.log
            fusion-coordinate-pool.status
            evaluations/fusion_coordinate_pool/summary.json
          if-no-files-found: warn
      - name: Enforce search success
        if: always()
        run: test "$(cat fusion-coordinate-pool.status)" = "0"
