name: fusion-sparse-valid

on:
  pull_request:
    paths:
      - .github/workflows/fusion-sparse-valid.yml
      - src/opfusion/fusion_sparse_valid.py
      - tests/test_fusion_sparse_valid.py
      - src/opfusion/training/data.py
      - runs/gpt_bias_fusion_factory_surface_v3/**
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test verifier-aware sparse compositor
        run: pytest -q tests/test_fusion_sparse_valid.py
      - name: Search sparse valid-set composition laws
        id: search
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m opfusion.fusion_sparse_valid \
            --calibration-examples-per-operator 3 \
            --max-prefixes-per-example 24 \
            --max-positions-per-cohort 512 \
            --verification-examples-per-operator 8 \
            --fit-steps 180 \
            --fit-batch-positions 96 \
            --learning-rate 0.02 \
            --l2-weight 0.001 \
            --hidden-size 12 \
            --calibration-seed 711000 \
            --holdout-seed 711500 \
            --verification-seed 712000 \
            --max-new-tokens 64 \
            --device cpu \
            --out evaluations/fusion_sparse_valid/summary.json \
            > fusion-sparse-valid.log 2>&1
          status=$?
          echo "$status" > fusion-sparse-valid.status
          cat fusion-sparse-valid.log
          exit "$status"
      - name: Print compact result
        if: steps.search.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('evaluations/fusion_sparse_valid/summary.json').read_text())
          print('holdout_ranking=', report['holdout_ranking'])
          print('selected=', report['autoregressive_selected_candidates'])
          print('recommended=')
          print(json.dumps(report['recommended_validation_composition'], indent=2, sort_keys=True))
          print('all_methods=')
          print(json.dumps(report['ranked_methods'], indent=2, sort_keys=True))
          PY
      - name: Upload sparse composition result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-sparse-valid
          path: |
            fusion-sparse-valid.log
            fusion-sparse-valid.status
            evaluations/fusion_sparse_valid/summary.json
          if-no-files-found: warn
      - name: Enforce search success
        if: always()
        run: test "$(cat fusion-sparse-valid.status)" = "0"
