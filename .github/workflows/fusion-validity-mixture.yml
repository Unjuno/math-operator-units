name: fusion-validity-mixture

on:
  pull_request:
    paths:
      - .github/workflows/fusion-validity-mixture.yml
      - src/opfusion/fusion_validity_mixture.py
      - src/opfusion/fusion_sparse_valid.py
      - src/opfusion/fusion_verify.py
      - tests/test_fusion_validity_mixture.py
      - runs/gpt_bias_fusion_factory_surface_v3/**
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test source-validity mixture
        run: pytest -q tests/test_fusion_validity_mixture.py
      - name: Learn and verify continuous validity mixtures
        shell: bash
        run: |
          set +e
          python -m opfusion.fusion_validity_mixture \
            --calibration-examples-per-operator 12 \
            --max-prefixes-per-example 32 \
            --max-positions-per-cohort 2048 \
            --verification-examples-per-operator 12 \
            --fit-steps 800 \
            --fit-batch-positions 128 \
            --learning-rate 0.01 \
            --hidden-size 16 \
            --sketch-size 8 \
            --device cpu \
            --out evaluations/fusion_validity_mixture/summary.json \
            > fusion-validity-mixture.log 2>&1
          status=$?
          echo "$status" > fusion-validity-mixture.status
          cat fusion-validity-mixture.log
          exit "$status"
      - name: Print compact result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('evaluations/fusion_validity_mixture/summary.json')
          if path.is_file():
              report = json.loads(path.read_text())
              print(json.dumps({
                  'holdout_ranking': report.get('holdout_ranking'),
                  'recommended': report.get('recommended_validation_composition'),
                  'passing_methods': report.get('passing_methods'),
              }, indent=2, sort_keys=True))
          PY
      - name: Upload validity-mixture result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-validity-mixture
          path: |
            fusion-validity-mixture.log
            fusion-validity-mixture.status
            evaluations/fusion_validity_mixture/summary.json
          if-no-files-found: warn
      - name: Enforce search success
        if: always()
        run: test "$(cat fusion-validity-mixture.status)" = "0"
