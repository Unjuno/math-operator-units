name: fusion-token-evidence

on:
  pull_request:
    paths:
      - .github/workflows/fusion-token-evidence.yml
      - src/opfusion/fusion_token_evidence.py
      - src/opfusion/fusion_coordinate_gate.py
      - src/opfusion/fusion_sparse_valid.py
      - src/opfusion/fusion_verify.py
      - tests/test_fusion_token_evidence.py
      - runs/gpt_bias_fusion_factory_surface_v3/**
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test token-evidence compositor
        run: pytest -q tests/test_fusion_token_evidence.py
      - name: Learn and verify token-evidence composition
        shell: bash
        run: |
          set +e
          python -m opfusion.fusion_token_evidence \
            --calibration-examples-per-operator 4 \
            --max-prefixes-per-example 24 \
            --max-positions-per-cohort 512 \
            --verification-examples-per-operator 8 \
            --fit-steps 240 \
            --fit-batch-positions 16 \
            --learning-rate 0.01 \
            --hidden-size 24 \
            --device cpu \
            --out evaluations/fusion_token_evidence/summary.json \
            > fusion-token-evidence.log 2>&1
          status=$?
          echo "$status" > fusion-token-evidence.status
          cat fusion-token-evidence.log
          exit "$status"
      - name: Print compact result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('evaluations/fusion_token_evidence/summary.json')
          if path.is_file():
              report = json.loads(path.read_text())
              print(json.dumps({
                  'holdout_ranking': report.get('holdout_ranking'),
                  'recommended': report.get('recommended_validation_composition'),
                  'passing_methods': report.get('passing_methods'),
              }, indent=2, sort_keys=True))
          PY
      - name: Upload token-evidence result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-token-evidence
          path: |
            fusion-token-evidence.log
            fusion-token-evidence.status
            evaluations/fusion_token_evidence/summary.json
          if-no-files-found: warn
      - name: Enforce search success
        if: always()
        run: test "$(cat fusion-token-evidence.status)" = "0"
