name: fusion-stateful-deterministic-confirmation

concurrency:
  group: fusion-stateful-deterministic-confirmation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/fusion-stateful-deterministic-confirmation.yml
      - src/opfusion/fusion_stateful_dual_timescale_confirmatory_deterministic.py
      - src/opfusion/fusion_stateful_dual_timescale_confirmatory_deterministic_neg_neutral.py
      - tests/test_fusion_stateful_dual_timescale_deterministic.py
  workflow_dispatch:

jobs:
  deterministic-all-source-replica:
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test deterministic calibration
        run: pytest -q tests/test_fusion_stateful_dual_timescale_deterministic.py tests/test_fusion_stateful_dual_timescale_confirmatory.py
      - name: Run deterministic all-source confirmation
        shell: bash
        run: |
          set +e
          python -m opfusion.fusion_stateful_dual_timescale_confirmatory_deterministic \
            --calibration-examples-per-operator 8 \
            --max-prefixes-per-example 24 \
            --max-positions-per-cohort 1536 \
            --fit-steps 500 \
            --fit-batch-positions 96 \
            --state-search-examples-per-operator 1 \
            --verification-examples-per-operator 24 \
            --maximum-verification-candidates 3 \
            --hidden-size 16 \
            --sketch-size 8 \
            --learning-rate 0.01 \
            --calibration-seed 731000 \
            --state-search-seed 731500 \
            --verification-seed 732000 \
            --device cpu \
            --out evaluations/fusion_stateful_deterministic/all_${{ matrix.replica }}.json \
            > deterministic-all-${{ matrix.replica }}.log 2>&1
          status=$?
          echo "$status" > deterministic-all-${{ matrix.replica }}.status
          cat deterministic-all-${{ matrix.replica }}.log
          exit "$status"
      - name: Upload deterministic all-source replica
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-stateful-deterministic-all-${{ matrix.replica }}
          path: |
            deterministic-all-${{ matrix.replica }}.log
            deterministic-all-${{ matrix.replica }}.status
            evaluations/fusion_stateful_deterministic/all_${{ matrix.replica }}.json
          if-no-files-found: warn
      - name: Enforce deterministic all-source success
        if: always()
        run: test "$(cat deterministic-all-${{ matrix.replica }}.status)" = "0"

  deterministic-neg-neutral:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test deterministic NEG-neutral calibration
        run: pytest -q tests/test_fusion_stateful_dual_timescale_deterministic.py tests/test_fusion_stateful_dual_timescale_neg_neutral.py
      - name: Run deterministic NEG-neutral confirmation
        shell: bash
        run: |
          set +e
          python -m opfusion.fusion_stateful_dual_timescale_confirmatory_deterministic_neg_neutral \
            --calibration-examples-per-operator 8 \
            --max-prefixes-per-example 24 \
            --max-positions-per-cohort 1536 \
            --fit-steps 500 \
            --fit-batch-positions 96 \
            --state-search-examples-per-operator 1 \
            --verification-examples-per-operator 24 \
            --maximum-verification-candidates 3 \
            --hidden-size 16 \
            --sketch-size 8 \
            --learning-rate 0.01 \
            --calibration-seed 731000 \
            --state-search-seed 731500 \
            --verification-seed 732000 \
            --device cpu \
            --out evaluations/fusion_stateful_deterministic/neg_neutral.json \
            > deterministic-neg.log 2>&1
          status=$?
          echo "$status" > deterministic-neg.status
          cat deterministic-neg.log
          exit "$status"
      - name: Upload deterministic NEG-neutral result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-stateful-deterministic-neg-neutral
          path: |
            deterministic-neg.log
            deterministic-neg.status
            evaluations/fusion_stateful_deterministic/neg_neutral.json
          if-no-files-found: warn
      - name: Enforce deterministic NEG-neutral success
        if: always()
        run: test "$(cat deterministic-neg.status)" = "0"
