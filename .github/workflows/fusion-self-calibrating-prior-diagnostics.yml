name: fusion-self-calibrating-prior-diagnostics

concurrency:
  group: fusion-self-calibrating-prior-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/fusion-self-calibrating-prior-diagnostics.yml
      - src/opfusion/fusion_self_calibrating_prior_diagnostics.py
      - tests/test_fusion_self_calibrating_prior_diagnostics.py
  workflow_dispatch:

jobs:
  source-prior-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Test diagnostics
        run: >-
          pytest -q
          tests/test_fusion_self_calibrating_prior_diagnostics.py
          tests/test_fusion_self_calibrating_operator_controller.py
      - name: Run prior diagnostics
        shell: bash
        env:
          OPFUSION_MIXER_ENSEMBLE_MODE: arithmetic
        run: |
          set +e
          python -m opfusion.fusion_self_calibrating_prior_diagnostics \
            --root "$GITHUB_WORKSPACE" \
            --calibration-examples-per-operator 8 \
            --max-prefixes-per-example 24 \
            --max-positions-per-cohort 1536 \
            --fit-steps 500 \
            --fit-batch-positions 96 \
            --hidden-size 16 \
            --sketch-size 8 \
            --learning-rate 0.01 \
            --calibration-seed 731000 \
            --controller-train-examples-per-operator 24 \
            --controller-holdout-examples-per-operator 16 \
            --controller-seed 739000 \
            --controller-holdout-seed 739500 \
            --controller-embedding-size 16 \
            --controller-hidden-size 16 \
            --controller-learning-rate 0.03 \
            --controller-steps 300 \
            --controller-prior-l2-weight 0.001 \
            --composition-examples-per-pair 4 \
            --data-seed 733000 \
            --device cpu \
            --out evaluations/self_calibrating_operator_controller/prior-diagnostics.json \
            > self-calibrating-prior-diagnostics.log 2>&1
          status=$?
          echo "$status" > self-calibrating-prior-diagnostics.status
          cat self-calibrating-prior-diagnostics.log
          exit "$status"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-self-calibrating-prior-diagnostics
          path: |
            self-calibrating-prior-diagnostics.log
            self-calibrating-prior-diagnostics.status
            evaluations/self_calibrating_operator_controller/prior-diagnostics.json
          if-no-files-found: warn
      - name: Enforce diagnostics success
        if: always()
        run: test "$(cat self-calibrating-prior-diagnostics.status)" = "0"
